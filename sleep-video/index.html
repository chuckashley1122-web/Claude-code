<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* ---- Night sky ---- */
      #sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1200px 700px at 78% 18%, #1b2b57 0%, rgba(27, 43, 87, 0) 60%),
          linear-gradient(180deg, #060a1c 0%, #0b1230 45%, #131a3d 100%);
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #dfe7ff;
      }

      #moon {
        position: absolute;
        left: 210px;
        top: 400px;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 34%, #fdfcf5 0%, #e9ecff 55%, #c3ccf0 100%);
        box-shadow: 0 0 60px 18px rgba(226, 232, 255, 0.35);
      }

      /* ---- Text ---- */
      #title {
        position: absolute;
        top: 96px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #eef2ff;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      #subtitle {
        position: absolute;
        top: 190px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #93a4d8;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      /* ---- Battery (the metaphor) ---- */
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #battery-wrap {
        position: relative;
        width: 230px;
        height: 400px;
        margin-top: 60px;
      }
      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 460px;
        height: 620px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(34, 197, 94, 0.55) 0%, rgba(34, 197, 94, 0) 62%);
        opacity: 0;
      }
      #battery-cap {
        position: absolute;
        top: -30px;
        left: 50%;
        transform: translateX(-50%);
        width: 96px;
        height: 30px;
        background: #cdd6f4;
        border-radius: 10px 10px 4px 4px;
      }
      #battery-body {
        position: absolute;
        inset: 0;
        border: 12px solid #cdd6f4;
        border-radius: 32px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
      }
      #fill {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        transform-origin: bottom center;
        background: #f59e0b;
      }
      #pct {
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        transform: translateY(-50%);
        text-align: center;
        color: #ffffff;
        font-size: 66px;
        font-weight: 800;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      }
      #charge-label {
        position: absolute;
        left: 0;
        bottom: -70px;
        width: 100%;
        text-align: center;
        color: #22c55e;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 2px;
        opacity: 0;
      }

      /* ---- Benefit chips ---- */
      .chip {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 30px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(207, 214, 244, 0.28);
        border-radius: 999px;
        color: #eef2ff;
        font-size: 30px;
        font-weight: 600;
        white-space: nowrap;
        opacity: 0;
      }
      .chip .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #22c55e;
      }
      #chip1 { top: 430px; left: 1230px; }
      #chip2 { top: 560px; left: 1300px; }
      #chip3 { top: 690px; left: 1230px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="sky">
        <!-- static, hand-placed stars (deterministic) -->
        <div class="star" style="left: 140px;  top: 150px; width: 4px;  height: 4px;  opacity: .9"></div>
        <div class="star" style="left: 420px;  top: 90px;  width: 3px;  height: 3px;  opacity: .7"></div>
        <div class="star" style="left: 700px;  top: 210px; width: 5px;  height: 5px;  opacity: .8"></div>
        <div class="star" style="left: 980px;  top: 120px; width: 3px;  height: 3px;  opacity: .6"></div>
        <div class="star" style="left: 1180px; top: 260px; width: 4px;  height: 4px;  opacity: .85"></div>
        <div class="star" style="left: 1500px; top: 140px; width: 3px;  height: 3px;  opacity: .7"></div>
        <div class="star" style="left: 1680px; top: 300px; width: 5px;  height: 5px;  opacity: .8"></div>
        <div class="star" style="left: 1780px; top: 90px;  width: 4px;  height: 4px;  opacity: .75"></div>
        <div class="star" style="left: 300px;  top: 780px; width: 3px;  height: 3px;  opacity: .5"></div>
        <div class="star" style="left: 560px;  top: 900px; width: 4px;  height: 4px;  opacity: .6"></div>
        <div class="star" style="left: 1620px; top: 820px; width: 4px;  height: 4px;  opacity: .55"></div>
        <div class="star" style="left: 1400px; top: 940px; width: 3px;  height: 3px;  opacity: .5"></div>
        <div id="moon"></div>
      </div>

      <div id="title">Sleep recharges you.</div>
      <div id="subtitle">Every night, your body refuels</div>

      <div id="stage">
        <div id="battery-wrap">
          <div id="glow"></div>
          <div id="battery-cap"></div>
          <div id="battery-body">
            <div id="fill"></div>
          </div>
          <div id="pct">15%</div>
          <div id="charge-label">FULLY CHARGED</div>
        </div>
      </div>

      <div class="chip" id="chip1"><span class="dot"></span>Sharper memory</div>
      <div class="chip" id="chip2"><span class="dot"></span>Stronger immunity</div>
      <div class="chip" id="chip3"><span class="dot"></span>Brighter mood</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Title + subtitle entrance
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.1);
      tl.fromTo("#subtitle", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.35);

      // Moon arcs left -> right across the night sky (a night passing)
      tl.to("#moon", { x: 1360, duration: 8, ease: "none" }, 0);
      tl.to("#moon", { y: -130, duration: 4, ease: "sine.out" }, 0);
      tl.to("#moon", { y: 30, duration: 4, ease: "sine.in" }, 4);

      // The metaphor: the battery charges while you sleep
      tl.set("#fill", { scaleY: 0.15 }, 0);
      tl.to("#fill", { scaleY: 1, duration: 7.0, ease: "power1.inOut" }, 0.5);
      tl.to("#fill", { backgroundColor: "#22c55e", duration: 5.0, ease: "none" }, 2.5);

      // Percentage counts up in lockstep with the fill (onUpdate fires on seek)
      const counter = { v: 15 };
      const pct = document.getElementById("pct");
      tl.to(counter, {
        v: 100,
        duration: 7.0,
        ease: "power1.inOut",
        onUpdate: () => { pct.textContent = Math.round(counter.v) + "%"; }
      }, 0.5);

      // Benefit chips appear one by one as the charge climbs
      tl.fromTo("#chip1", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.2);
      tl.fromTo("#chip2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.6);
      tl.fromTo("#chip3", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.0);

      // Fully-charged payoff: green glow + label + one reassuring pulse
      tl.to("#glow", { opacity: 1, duration: 0.9, ease: "power2.out" }, 6.6);
      tl.fromTo("#charge-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.9);
      tl.to("#battery-wrap", { scale: 1.05, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
