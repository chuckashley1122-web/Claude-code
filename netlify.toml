# Netlify configuration for the Kent Bates static site
# Deploy: connect this repo to Netlify (or drag-and-drop the kentbates-site folder).
# No build step — it's plain HTML/CSS/JS.

[build]
  publish = "kentbates-site"
  command = ""

# Security + sensible defaults on every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache immutable assets (artwork, favicon, og image)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shorter cache for CSS/JS so style tweaks ship promptly
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify automatically serves 404.html for unmatched routes.
