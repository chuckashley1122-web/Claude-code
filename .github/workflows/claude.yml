name: Jarvis Claude Executor

# This is the "hands" of the Jarvis integration.
# Jarvis (your ElevenLabs voice agent) opens a GitHub issue whose body starts
# with "@claude <task>". That fires this workflow, which runs Claude Code to do
# the actual coding work and open a pull request.
#
# It also responds to @claude mentions in issue comments and PR review comments,
# so you can follow up by voice (Jarvis comments) or by typing on the PR.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # Only run when @claude is actually mentioned, to avoid burning minutes/tokens.
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against your Claude Max subscription (no per-token API
          # billing). Generate the token with `claude setup-token` and store it
          # as the CLAUDE_CODE_OAUTH_TOKEN repo secret. See docs/jarvis-setup.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `prompt:` here on purpose — for issue/comment events Claude reads
          # the thread and responds to the @claude mention automatically.
          claude_args: |
            --max-turns 20
