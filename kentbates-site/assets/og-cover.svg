<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Kent Bates — Surreal Pop Collage">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="og-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6fe5"/><stop offset="1" stop-color="#1aa06a"/>
    </linearGradient>
    <pattern id="og-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.4" fill="#1f6fe5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-dots)"/>

  <!-- collage tiles -->
  <g>
    <rect x="760" y="70" width="220" height="280" rx="14" fill="url(#og-tile)" transform="rotate(-5 870 210)"/>
    <rect x="940" y="220" width="200" height="250" rx="14" fill="#16222e" transform="rotate(6 1040 345)"/>
    <circle cx="900" cy="430" r="70" fill="#2bb38a"/>
    <circle cx="1015" cy="150" r="46" fill="none" stroke="#1f6fe5" stroke-width="10"/>
  </g>

  <!-- brand dot + kicker -->
  <g transform="translate(90 230)">
    <circle cx="14" cy="-6" r="14" fill="#1f6fe5"/>
    <text x="44" y="0" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#44586c" letter-spacing="6">SURREAL POP COLLAGE</text>
  </g>

  <text x="86" y="350" font-family="Archivo Black, Arial Black, sans-serif" font-size="118" font-weight="900" fill="#16222e">KENT BATES</text>
  <text x="90" y="430" font-family="Inter, sans-serif" font-size="34" fill="#44586c">Originals · Limited Prints · Wearable Art</text>

  <rect x="90" y="470" width="260" height="8" rx="4" fill="url(#og-tile)"/>
</svg>
